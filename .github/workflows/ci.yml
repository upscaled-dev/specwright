name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Unit tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Release contract tests
        run: npm run test:contracts

  integration:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: 1.132.0
          - os: ubuntu-latest
            vscode: 1.99.0
          - os: windows-latest
            vscode: 1.132.0
          - os: macos-latest
            vscode: 1.132.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless VS Code runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Integration tests
        if: runner.os != 'Linux'
        env:
          SPECWRIGHT_VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration

      - name: Integration tests (headless)
        if: runner.os == 'Linux'
        env:
          SPECWRIGHT_VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration

  package:
    name: Tested VSIX
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: [quality, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless VS Code runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Build production bundle once
        run: npm run build:release

      - name: Package release candidate
        run: npm run package:release

      - name: Test built bundle
        run: xvfb-run -a npm run test:integration:built

      - name: Smoke-test installed VSIX
        run: xvfb-run -a npm run test:vsix

      - name: Verify tested VSIX checksum
        run: npm run verify:release

      - name: Upload tested release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specwright-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.sbom.cdx.json
            dist/*.artifact-set.json

      - name: Retain production source maps separately
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specwright-source-maps-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*.map

  promote:
    name: Promote tested release candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate release tag and source commit
        id: source
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "Release commit $commit is not reachable from origin/main" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Locate successful main candidate
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          runs="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$COMMIT" \
            -f per_page=100)"
          run_id="$(jq -r --arg commit "$COMMIT" \
            '[.workflow_runs[] | select(.head_sha == $commit)] | sort_by(.run_number) | last | .id // empty' \
            <<< "$runs")"
          if [[ -z "$run_id" ]]; then
            echo "No successful main CI candidate exists for $COMMIT" >&2
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download tested release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: specwright-${{ steps.source.outputs.commit }}
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run-id }}

      - name: Verify candidate identity and contents
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          mapfile -t vsix_files < <(find candidate -maxdepth 1 -type f -name '*.vsix' -print)
          if [[ "${#vsix_files[@]}" -ne 1 ]]; then
            echo "Expected one VSIX in the candidate, found ${#vsix_files[@]}" >&2
            exit 1
          fi
          node scripts/release-artifact.mjs --verify --out "${vsix_files[0]}" \
            --commit "$COMMIT" --version "$VERSION"

      - name: Attest exact VSIX
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: candidate/*.vsix

      - name: Retain promoted artifact set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specwright-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: candidate/*
