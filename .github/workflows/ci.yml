name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Unit coverage
        if: runner.os == 'Linux'
        run: npm run test:coverage

      - name: Unit tests
        if: runner.os != 'Linux'
        run: npm test

      - name: Release contract tests
        run: npm run test:contracts

  integration:
    name: VS Code ${{ matrix.vscode }} (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode: stable
          - os: ubuntu-latest
            vscode: minimum
          - os: windows-latest
            vscode: stable
          - os: macos-latest
            vscode: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless VS Code runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Integration tests
        if: runner.os != 'Linux'
        env:
          SPECWRIGHT_VSCODE_VERSION: ${{ matrix.vscode }}
        run: npm run test:integration

      - name: Integration tests (headless)
        if: runner.os == 'Linux'
        env:
          SPECWRIGHT_VSCODE_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration

  package:
    name: Tested VSIX
    needs: [quality, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install headless VS Code runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: Build production bundle once
        run: npm run build:release

      - name: Package release candidate
        run: npm run package:release

      - name: Test built bundle
        run: xvfb-run -a npm run test:integration:built

      - name: Smoke-test installed VSIX
        run: xvfb-run -a npm run test:vsix

      - name: Verify tested VSIX checksum
        run: npm run verify:release

      - name: Upload tested release candidate
        uses: actions/upload-artifact@v4
        with:
          name: specwright-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/*.vsix
            dist/*.vsix.sha256
            dist/*.sbom.cdx.json
            dist/*.artifact-set.json

      - name: Retain production source maps separately
        uses: actions/upload-artifact@v4
        with:
          name: specwright-source-maps-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: dist/*.map

  attest:
    name: Attest release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download tested release candidate
        uses: actions/download-artifact@v4
        with:
          name: specwright-${{ github.sha }}
          path: candidate

      - name: Attest exact VSIX
        uses: actions/attest@v4
        with:
          subject-path: candidate/*.vsix
